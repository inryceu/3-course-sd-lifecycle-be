version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["major"]
    labels:
      - "dependencies"
    reviewers:
      - "Kyrylo"
    assignees:
      - "Kyrylo"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps:dev)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - "*"
    labels:
      - "dependencies"
    reviewers:
      - "Kyrylo"
    assignees:
      - "Kyrylo"
    commit-message:
      prefix: "chore(deps:docker)"
