name: CI Pipeline (Cost-Free)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Validate full-stack compose file
        # Dummy values only satisfy the ${VAR:?} guards; nothing is started.
        run: docker compose -f docker-compose.full.yml config --quiet
        env:
          DATABASE_PASSWORD: ci
          JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
          JIRA_CLIENT_ID: ci
          JIRA_CLIENT_SECRET: ci
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WEBHOOK_SECRET: ci-webhook-secret-with-at-least-32-chars

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Validate OpenAPI contract
        run: pnpm api:validate

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: boardsync_test
      DATABASE_LOGGING: false
      JWT_SECRET: ci-test-jwt-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: 10
      JIRA_CLIENT_ID: test-client-id
      JIRA_CLIENT_SECRET: test-client-secret
      JIRA_REDIRECT_URI: http://localhost:5173/jira/callback
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      WEBHOOK_SECRET: ci-test-webhook-secret-with-at-least-32-chars
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boardsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boardsync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for database
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres -d boardsync_test; do sleep 2; done'

      # Migration gate: every TypeORM migration must apply to an empty PostgreSQL 16 database
      # (the `postgres` service container above) before any test runs.
      - name: Run migrations against the Postgres service container
        run: pnpm migration:run

      # Fails below the agreed thresholds: 70 % lines repo-wide (jest.config.js) and 85 % lines per
      # auth/jira-sync application service (scripts/check-service-coverage.mjs).
      - name: Run unit tests with coverage
        run: pnpm test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Run integration tests (real PostgreSQL)
        run: pnpm test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: boardsync-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
