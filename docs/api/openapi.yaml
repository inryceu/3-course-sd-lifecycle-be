components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/auth/register` or `/auth/login`, valid for at most one hour.

  parameters:
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ColumnId:
      name: columnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BoardIdQuery:
      name: boardId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation failed or the request is not acceptable in the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired token, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The user's board role does not allow this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist or the user is not a member of its board
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: A message, or one message per invalid field
        details:
          type: object
          additionalProperties: true

    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [up, down]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number

    BoardRole:
      type: string
      enum: [ADMIN, MEMBER, VIEWER]
    ColumnType:
      type: string
      enum: [TODO, IN_PROGRESS, REVIEW, DONE]

    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Lifetime in seconds (at most 3600)
        user:
          $ref: '#/components/schemas/User'

    Board:
      type: object
      required: [id, title, myRole, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        jiraProjectKey:
          type: string
          nullable: true
        myRole:
          $ref: '#/components/schemas/BoardRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BoardDetail:
      allOf:
        - $ref: '#/components/schemas/Board'
        - type: object
          required: [columns]
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/ColumnWithCards'
    CreateBoardRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        jiraProjectKey:
          type: string
          maxLength: 50
    UpdateBoardRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 2000
        jiraProjectKey:
          type: string
          nullable: true
          maxLength: 50

    Column:
      type: object
      required: [id, boardId, title, type, position]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        title:
          type: string
        type:
          $ref: '#/components/schemas/ColumnType'
        position:
          type: integer
          minimum: 0
    ColumnWithCards:
      allOf:
        - $ref: '#/components/schemas/Column'
        - type: object
          required: [cards]
          properties:
            cards:
              type: array
              items:
                $ref: '#/components/schemas/Card'
    CreateColumnRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/ColumnType'
        position:
          type: integer
          minimum: 0
    UpdateColumnRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/ColumnType'
    ReorderColumnRequest:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 0

    Card:
      type: object
      required: [id, boardId, columnId, title, position, labelIds, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        columnId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        jiraIssueKey:
          type: string
          nullable: true
        position:
          type: integer
          minimum: 0
        assigneeId:
          type: string
          format: uuid
          nullable: true
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCardRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        deadline:
          type: string
          format: date-time
        assigneeId:
          type: string
          format: uuid
        labelIds:
          type: array
          items:
            type: string
            format: uuid
    UpdateCardRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 10000
        deadline:
          type: string
          format: date-time
          nullable: true
    MoveCardRequest:
      type: object
      required: [columnId, position]
      properties:
        columnId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
    AssignCardRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          format: uuid
          nullable: true

    Label:
      type: object
      required: [id, boardId, name, color]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
    CreateLabelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
    UpdateLabelRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'

    Comment:
      type: object
      required: [id, cardId, authorId, text, syncedToJira, createdAt]
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        text:
          type: string
        syncedToJira:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          type: string
          nullable: true

    Member:
      type: object
      required: [boardId, userId, role, email, displayName, invitedAt]
      properties:
        boardId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/BoardRole'
        email:
          type: string
          format: email
        displayName:
          type: string
        invitedAt:
          type: string
          format: date-time
    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [MEMBER, VIEWER]
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/BoardRole'

    JiraOAuthStartResponse:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string
          format: uri
    JiraOAuthCallbackResponse:
      type: object
      required: [connected, cloudId, siteUrl]
      properties:
        connected:
          type: boolean
        cloudId:
          type: string
        siteUrl:
          type: string
          format: uri
    JiraConnectionStatus:
      type: object
      required: [connected, boardId]
      description: Never contains tokens
      properties:
        connected:
          type: boolean
        boardId:
          type: string
          format: uuid
        cloudId:
          type: string
          nullable: true
        siteUrl:
          type: string
          format: uri
          nullable: true
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        connectedAt:
          type: string
          format: date-time
          nullable: true
    JiraImportRequest:
      type: object
      required: [boardId]
      properties:
        boardId:
          type: string
          format: uuid
        projectKey:
          type: string
    JiraImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
    JiraMapping:
      type: object
      required: [id, boardId, cardId, jiraIssueKey, jiraIssueId, jiraProjectKey]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        jiraIssueKey:
          type: string
        jiraIssueId:
          type: string
        jiraProjectKey:
          type: string
    CreateJiraMappingRequest:
      type: object
      required: [cardId, jiraIssueKey]
      properties:
        cardId:
          type: string
          format: uuid
        jiraIssueKey:
          type: string
    JiraConflict:
      type: object
      required: [id, boardId, cardId, jiraIssueKey, boardStatus, jiraStatus, detectedAt]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        jiraIssueKey:
          type: string
        boardStatus:
          type: string
        jiraStatus:
          type: string
        detectedAt:
          type: string
          format: date-time
        resolution:
          type: string
          nullable: true
    JiraConflictPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JiraConflict'
        nextCursor:
          type: string
          nullable: true

    Notification:
      type: object
      required: [id, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [deadline.reminder, jira.conflict, board.invited]
        payload:
          type: object
          additionalProperties: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: string
          nullable: true
