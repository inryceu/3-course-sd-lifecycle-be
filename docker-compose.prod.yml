# =============================================================================
# BoardSync Backend - Production Environment
# =============================================================================
# Optimized images, no bind mounts, health checks, resource limits
# Completely isolated from development environment
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Production)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: boardsync-postgres-prod
    environment:
      POSTGRES_USER: boardsync
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: boardsync_prod
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only for security
    volumes:
      - boardsync_postgres_prod_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - boardsync_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardsync -d boardsync_prod"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    secrets:
      - db_password

  # ---------------------------------------------------------------------------
  # Backend API (Production)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: boardsync-backend-prod
    environment:
      - NODE_ENV=production
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:3000:3000"  # Bind to localhost only; reverse proxy handles public access
    networks:
      - boardsync_prod_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Production) - Optional but recommended
  # Handles SSL termination, rate limiting, static files
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: boardsync-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - boardsync_prod_network
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

# -----------------------------------------------------------------------------
# Networks - Completely isolated from development
# -----------------------------------------------------------------------------
networks:
  boardsync_prod_network:
    name: boardsync-prod-network
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes - Separate from development volumes
# -----------------------------------------------------------------------------
volumes:
  boardsync_postgres_prod_data:
    name: boardsync-postgres-prod-data

# -----------------------------------------------------------------------------
# Secrets - Production secrets managed via Docker secrets
# -----------------------------------------------------------------------------
secrets:
  db_password:
    file: ./secrets/db_password.txt
    # In production, use: external: true (managed by orchestration platform)