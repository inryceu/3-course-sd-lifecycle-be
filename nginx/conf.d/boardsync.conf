# BoardSync production server blocks
# 80 -> 443 redirect; 443 terminates TLS and proxies to the backend.

# --- HTTP (80): redirect all traffic to HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HSTS must not be sent over plaintext; only the redirect happens here.
    return 301 https://$host$request_uri;
}

# --- HTTPS (443): TLS termination + proxy to backend --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/boardsync.crt;
    ssl_certificate_key /etc/nginx/ssl/boardsync.key;

    # Only TLS 1.2 and above (1.0 and 1.1 refused).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS: tell browsers to only use HTTPS for this host.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # Tell the backend the original scheme was https (needed for callback/webhook URLs).
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Host $host;

    # --- REST API -------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- Health (readiness/liveness) ------------------------------------------
    location /health/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- Socket.IO / WebSocket upgrades ---------------------------------------
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Disable buffering for WebSocket/long-polling.
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Fallback: everything else to backend ---------------------------------
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
