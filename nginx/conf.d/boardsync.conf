# BoardSync production server blocks
# 80 -> 443 redirect; 443 terminates TLS and proxies to the backend.

# --- HTTP (80): redirect all traffic to HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HSTS must not be sent over plaintext; only the redirect happens here.
    return 301 https://$host$request_uri;
}

# --- HTTPS (443): TLS termination + proxy to backend --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/boardsync.crt;
    ssl_certificate_key /etc/nginx/ssl/boardsync.key;

    # Only TLS 1.2 and above (1.0 and 1.1 refused).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (HSTS included) come from the backend's helmet, so they are not added
    # here: a second Strict-Transport-Security header would be sent on every response.
    # Health probes live under the API prefix: /api/v1/health/alive and /api/v1/health/ready.

    # --- REST API -------------------------------------------------------------
    location /api/v1/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backend;
    }

    # --- Socket.IO / WebSocket upgrades ---------------------------------------
    location /socket.io/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backend;
        # Disable buffering for WebSocket/long-polling.
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Fallback: everything else to backend ---------------------------------
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backend;
    }
}
