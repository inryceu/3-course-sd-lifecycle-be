# Shared by every `location` that proxies to the backend. nginx only inherits proxy_set_header from
# the enclosing level when a location sets none of its own, so keep them all in this one file.
proxy_http_version 1.1;
proxy_set_header Host $host;
# This nginx is the edge: nothing trusted sits in front of it, so the client's own
# X-Forwarded-* headers are overwritten, never appended to (they could forge the rate-limit key).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
# WebSocket upgrade; both are empty (header not sent) for plain requests, keeping upstream keep-alive.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
